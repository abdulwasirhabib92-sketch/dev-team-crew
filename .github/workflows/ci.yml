name: CI/CD for Dev Team Crew

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run import check
        run: python -c "from agents import create_all_agents; print('✅ Agents module OK')"
      - name: Run tasks check
        run: python -c "from tasks import create_all_tasks; print('✅ Tasks module OK')"
      - name: Run crew check
        run: python -c "from crew import DevTeamCrew; print('✅ Crew module OK')"
