services:
  - type: web
    name: dev-team-crew
    runtime: docker
    env: docker
    region: oregon
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      # ─── Western LLM Providers ─────────────────────────
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.6-flash
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-3-5-sonnet-20241022
      - key: OPENROUTER_API_KEY
        sync: false
      - key: HUGGINGFACE_API_KEY
        sync: false
      # ─── Chinese LLM Providers (all free) ───────────────
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: DEEPSEEK_MODEL
        value: deepseek-chat
      - key: SILICONFLOW_API_KEY
        sync: false
      - key: SILICONFLOW_MODEL
        value: Qwen/Qwen2.5-7B-Instruct
      - key: QWEN_API_KEY
        sync: false
      - key: QWEN_MODEL
        value: qwen-turbo
      - key: GLM_API_KEY
        sync: false
      - key: GLM_MODEL
        value: glm-4-flash
      - key: MOONSHOT_API_KEY
        sync: false
      - key: MOONSHOT_MODEL
        value: moonshot-v1-8k
      # ─── Agent Routing ─────────────────────────────────
      - key: RESEARCHER_LLM
        value: gemini
      - key: ARCHITECT_LLM
        value: openai
      - key: IMPLEMENTER_LLM
        value: anthropic
      - key: CRITIC_LLM
        value: openai
      - key: TESTER_LLM
        value: groq
      - key: DEVOPS_LLM
        value: gemini
      # ─── Supabase ──────────────────────────────────────
      - key: SUPABASE_URL
        value: https://hqmskhywllcyievplmsm.supabase.co
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
