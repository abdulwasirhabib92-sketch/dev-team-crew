<!DOCTYPE html>
<html lang="en">
<head>
    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dev Team Crew — AI Development Team</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg: #0a0e1a; --surface: #131829; --surface2: #1a2138;
            --border: #2a3252; --text: #e4e8f0; --text-dim: #8892b8;
            --accent: #6c5ce7; --accent2: #00cec9; --success: #00b894;
            --warning: #fdcb6e; --danger: #e17055; --cn: #ff6b6b;
        }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
        header { display: flex; justify-content: space-between; align-items: center; padding: 20px 0; border-bottom: 1px solid var(--border); margin-bottom: 30px; }
        .logo { display: flex; align-items: center; gap: 12px; }
        .logo-icon { width: 44px; height: 44px; border-radius: 12px; background: linear-gradient(135deg, var(--accent), var(--accent2)); display: flex; align-items: center; justify-content: center; font-size: 22px; }
        .logo h1 { font-size: 20px; font-weight: 700; } .logo p { font-size: 12px; color: var(--text-dim); }
        .status-badge { padding: 6px 14px; border-radius: 20px; font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 6px; }
        .status-ready { background: rgba(0,184,148,0.15); color: var(--success); border: 1px solid var(--success); }
        .status-loading { background: rgba(253,203,110,0.15); color: var(--warning); }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; animation: pulse 2s infinite; }
        @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }
        .section-title { font-size: 16px; font-weight: 600; margin-bottom: 16px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 1px; }

        .providers-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 12px; margin-bottom: 30px; }
        .provider-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 14px; transition: border-color 0.2s; }
        .provider-card.active { border-color: var(--success); }
        .provider-card.inactive { opacity: 0.5; }
        .provider-card.cn { border-left: 3px solid var(--cn); }
        .provider-card.cn.active { border-color: var(--cn); }
        .provider-name { font-size: 14px; font-weight: 600; margin-bottom: 4px; }
        .provider-meta { font-size: 11px; color: var(--text-dim); display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
        .provider-tag { padding: 2px 8px; border-radius: 10px; font-size: 10px; font-weight: 600; }
        .tag-free { background: rgba(0,184,148,0.15); color: var(--success); }
        .tag-paid { background: rgba(253,203,110,0.15); color: var(--warning); }
        .tag-cn { background: rgba(255,107,107,0.15); color: var(--cn); }
        .tag-us { background: rgba(0,206,201,0.15); color: var(--accent2); }
        .provider-status { font-size: 12px; margin-top: 6px; }
        .provider-status.on { color: var(--success); } .provider-status.off { color: var(--text-dim); }

        .task-card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 24px; margin-bottom: 30px; }
        .task-card h2 { font-size: 18px; margin-bottom: 16px; }
        .task-input-row { display: flex; gap: 12px; }
        .task-input { flex: 1; padding: 14px 18px; border-radius: 12px; background: var(--surface2); border: 1px solid var(--border); color: var(--text); font-size: 15px; outline: none; transition: border-color 0.2s; }
        .task-input:focus { border-color: var(--accent); } .task-input::placeholder { color: var(--text-dim); }
        .btn-primary { padding: 14px 28px; border-radius: 12px; border: none; cursor: pointer; background: linear-gradient(135deg, var(--accent), var(--accent2)); color: white; font-size: 15px; font-weight: 600; transition: transform 0.1s, opacity 0.2s; }
        .btn-primary:hover { opacity: 0.9; } .btn-primary:active { transform: scale(0.98); } .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }

        .team-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 16px; margin-bottom: 30px; }
        .agent-card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 20px; transition: border-color 0.2s, transform  0.2s; }
        .agent-card:hover { border-color: var(--accent); transform: translateY(-2px); }
        .agent-header { display: flex; align-items: center; gap: 14px; margin-bottom: 14px; }
        .agent-avatar { width: 48px; height: 48px; border-radius: 14px; display: flex; align-items: center; justify-content: center; font-size: 24px; }
        .agent-name { font-size: 17px; font-weight: 700; } .agent-role { font-size: 12px; color: var(--text-dim); }
        .agent-vibe { font-size: 13px; color: var(--text-dim); margin-bottom: 12px; line-height: 1.5; }
        .agent-catchphrase { font-size: 13px; font-style: italic; padding: 10px 14px; background: var(--surface2); border-radius: 10px; border-left: 3px solid var(--accent); }

        .results-card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 24px; margin-bottom: 30px; display: none; }
        .results-card.show { display: block; }
        .results-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
        .results-header h2 { font-size: 18px; }
        .spinner { width: 20px; height: 20px; border: 3px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .results-body { background: var(--surface2); border-radius: 12px; padding: 20px; font-size: 14px; line-height: 1.6; white-space: pre-wrap; max-height: 600px; overflow-y: auto; }

        .history-item { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; transition: border-color 0.2s; }
        .history-item:hover { border-color: var(--accent); }
        .history-item .topic { font-size: 14px; font-weight: 500; } .history-item .time { font-size: 12px; color: var(--text-dim); }
        .history-item .badge { padding: 2px 10px; border-radius: 10px; font-size: 11px; font-weight: 600; margin-left: 8px; }
        .badge-running { background: rgba(253,203,110,0.15); color: var(--warning); }
        .badge-completed { background: rgba(0,184,148,0.15); color: var(--success); }
        .badge-failed { background: rgba(225,112,85,0.15); color: var(--danger); }

        @media (max-width: 600px) { .task-input-row { flex-direction: column; } .team-grid { grid-template-columns: 1fr; } .providers-grid { grid-template-columns: 1fr 1fr; } }
    </style>
</head>
<body>
<div class="container">
    <header>
        <div class="logo">
            <div class="logo-icon">🚀</div>
            <div><h1>Dev Team Crew</h1><p>6 AI agents · 11 LLM providers · West + East 🌍</p></div>
        </div>
        <div class="status-badge status-loading" id="statusBadge">
            <span class="status-dot"></span><span id="statusText">Connecting...</span>
        </div>
    </header>

    <div class="section-title">LLM Providers (11 supported — 6 Western + 5 Chinese)</div>
    <div class="providers-grid" id="providersGrid"></div>

    <div class="task-card">
        <h2>📋 Assign a Task</h2>
        <div class="task-input-row">
            <input type="text" class="task-input" id="taskInput" placeholder="e.g. Build a REST API for a todo app with auth..." />
            <button class="btn-primary" id="runBtn" onclick="runTask()">Deploy Team</button>
        </div>
    </div>

    <div class="results-card" id="resultsCard">
        <div class="results-header"><h2>📝 Team Output</h2><div id="resultsSpinner"></div></div>
        <div class="results-body" id="resultsBody"></div>
    </div>

    <div class="section-title">The Team</div>
    <div class="team-grid" id="teamGrid"></div>

    <div class="section-title" id="historyTitle" style="display:none;">Recent Tasks</div>
    <div id="history"></div>
</div>

<script>
const API_BASE = window.location.origin;
let allProviders = [];
let currentTaskId = null;
let pollInterval = null;

const AVATARS = {
    researcher: { emoji: '🔍', color: '#6c5ce7' }, architect: { emoji: '🏗️', color: '#00cec9' },
    implementer: { emoji: '⚒️', color: '#e17055' }, critic: { emoji: '🔎', color: '#fd79a8' },
    tester: { emoji: '🧪', color: '#00b894' }, devops: { emoji: '🚀', color: '#fdcb6e' },
};

async function init() {
    try {
        const res = await fetch(`${API_BASE}/api/info`);
        const data = await res.json();
        allProviders = data.all_providers || [];
        const badge = document.getElementById('statusBadge');
        const statusText = document.getElementById('statusText');
        if (data.status === 'ready') { badge.className = 'status-badge status-ready'; statusText.textContent = `${data.llm_providers.length} LLMs Active`; }
        else { badge.className = 'status-badge status-loading'; statusText.textContent = 'Needs API Keys'; }
        renderProviders();
        renderTeam(data.team || []);
        loadHistory();
    } catch (e) { document.getElementById('statusText').textContent = 'Offline'; }
}

function renderProviders() {
    const grid = document.getElementById('providersGrid');
    grid.innerHTML = allProviders.map(p => {
        const tags = [];
        tags.push(p.free ? '<span class="provider-tag tag-free">FREE</span>' : '<span class="provider-tag tag-paid">PAID</span>');
        tags.push(p.region === 'CN' ? '<span class="provider-tag tag-cn">🇨🇳 CN</span>' : '<span class="provider-tag tag-us">🇺🇸 US</span>');
        return `<div class="provider-card ${p.active ? 'active' : 'inactive'} ${p.region === 'CN' ? 'cn' : ''}">
            <div class="provider-name">${p.name}</div>
            <div class="provider-meta">${tags.join('')}</div>
            <div class="provider-status ${p.active ? 'on' : 'off'}">${p.active ? '✅ Active' : '⚪ Inactive'}</div>
        </div>`;
    }).join('');
}

function renderTeam(team) {
    const grid = document.getElementById('teamGrid');
    grid.innerHTML = team.map(member => {
        const key = member.role.toLowerCase();
        const avatar = AVATARS[key] || { emoji: '🤖', color: '#6c5ce7' };
        return `<div class="agent-card">
            <div class="agent-header">
                <div class="agent-avatar" style="background: ${avatar.color}22; border: 1px solid ${avatar.color};">${avatar.emoji}</div>
                <div><div class="agent-name">${member.codename}</div><div class="agent-role">${member.role}</div></div>
            </div>
            <div class="agent-vibe">${member.vibe}</div>
            <div class="agent-catchphrase">"${member.catchphrase}"</div>
        </div>`;
    }).join('');
}

async function runTask() {
    const input = document.getElementById('taskInput');
    const btn = document.getElementById('runBtn');
    const topic = input.value.trim();
    if (!topic) return;
    btn.disabled = true; btn.textContent = 'Deploying...';

    const card = document.getElementById('resultsCard');
    const body = document.getElementById('resultsBody');
    const spinner = document.getElementById('resultsSpinner');
    card.classList.add('show'); spinner.innerHTML = '<div class="spinner"></div>';
    body.textContent = '⏳ Deploying the team...';

    try {
        const res = await fetch(`${API_BASE}/api/run`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ topic }) });
        const data = await res.json();

        if (data.status === 'failed') { spinner.innerHTML = '❌'; body.textContent = data.error || 'Failed to start'; btn.disabled = false; btn.textContent = 'Deploy Team'; return; }

        currentTaskId = data.task_id;
        body.textContent = `🚀 Task ${data.task_id} started! The team is working...\n\nSage is researching → Atlas is designing → Forge is building → Vesper is reviewing → Echo is testing → Beacon is deploying\n\nPolling for updates every 5 seconds...`;
        btn.textContent = 'Running...';

        // Start polling
        if (pollInterval) clearInterval(pollInterval);
        pollInterval = setInterval(() => pollTask(data.task_id), 5000);
        pollTask(data.task_id); // immediate first poll

        addHistory(topic, data.task_id, 'running');
    } catch (e) { spinner.innerHTML = '❌'; body.textContent = `Error: ${e.message}`; btn.disabled = false; btn.textContent = 'Deploy Team'; }
}

async function pollTask(taskId) {
    try {
        const res = await fetch(`${API_BASE}/api/task/${taskId}`);
        const data = await res.json();
        const body = document.getElementById('resultsBody');
        const spinner = document.getElementById('resultsSpinner');
        const btn = document.getElementById('runBtn');

        if (data.status === 'running') {
            body.textContent = `⏳ The team is still working (task ${taskId})...\n\nEach agent uses multiple LLMs to complete their part. This can take 2-5 minutes.`;
        } else if (data.status === 'completed') {
            if (pollInterval) clearInterval(pollInterval);
            spinner.innerHTML = '✅';
            body.textContent = data.result || 'Task completed with no output.';
            btn.disabled = false; btn.textContent = 'Deploy Team';
            updateHistory(taskId, 'completed');
        } else if (data.status === 'failed') {
            if (pollInterval) clearInterval(pollInterval);
            spinner.innerHTML = '❌';
            body.textContent = data.result || 'Task failed.';
            btn.disabled = false; btn.textContent = 'Deploy Team';
            updateHistory(taskId, 'failed');
        }
    } catch (e) { console.error('Poll error:', e); }
}

function addHistory(topic, taskId, status) {
    const historyEl = document.getElementById('history');
    const titleEl = document.getElementById('historyTitle');
    titleEl.style.display = 'block';
    const now = new Date().toLocaleTimeString();
    const badgeClass = status === 'running' ? 'badge-running' : status === 'completed' ? 'badge-completed' : 'badge-failed';
    const item = document.createElement('div');
    item.className = 'history-item'; item.id = `history-${taskId}`;
    item.innerHTML = `<span class="topic">${topic}<span class="badge ${badgeClass}">${status}</span></span><span class="time">${now}</span>`;
    historyEl.prepend(item);
}

function updateHistory(taskId, status) {
    const item = document.getElementById(`history-${taskId}`);
    if (item) { const badge = item.querySelector('.badge'); if (badge) { badge.className = `badge badge-${status}`; badge.textContent = status; } }
}

async function loadHistory() {
    try {
        const res = await fetch(`${API_BASE}/api/tasks`);
        const data = await res.json();
        if (data.tasks && data.tasks.length > 0) {
            const historyEl = document.getElementById('history');
            const titleEl = document.getElementById('historyTitle');
            titleEl.style.display = 'block';
            historyEl.innerHTML = data.tasks.map(t => {
                const status = t.status || 'unknown';
                const badgeClass = `badge-${status}`;
                return `<div class="history-item" onclick="loadTask('${t.task_id}')">
                    <span class="topic">${t.topic || 'Unknown'}<span class="badge ${badgeClass}">${status}</span></span>
                    <span class="time">${t.created_at ? new Date(t.created_at).toLocaleString() : ''}</span>
                </div>`;
            }).join('');
        }
    } catch (e) {}
}

async function loadTask(taskId) {
    currentTaskId = taskId;
    const card = document.getElementById('resultsCard');
    card.classList.add('show');
    pollTask(taskId);
    if (pollInterval) clearInterval(pollInterval);
    pollInterval = setInterval(() => pollTask(taskId), 5000);
}

document.getElementById('taskInput').addEventListener('keypress', (e) => { if (e.key === 'Enter') runTask(); });
init();
</script>
</body>
</html>
